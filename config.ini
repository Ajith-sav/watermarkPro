[database]
; PostgreSQL connection settings
; Copy this file to  config.ini  and fill in your server details.
host     = localhost
port     = 5432
dbname   = watermark
user     = postgres
password = root_123
sslmode  = prefer

[app]
; Organisation display name (shown in watermark and tray)
org_name    = Mr.A Corporation
; App version string
version     = 1.0.0
; Install directory (used by build scripts)
install_dir = C:\Program Files\WatermarkPro
; Log level: DEBUG | INFO | WARNING | ERROR
log_level   = INFO
